[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-engineering"
version = "0.1.0"
description = "Declarative engineering state graph engine for botmux collaboration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pymongo>=4.13,<5",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
graphctl = "graph_engineering.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_engineering"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
