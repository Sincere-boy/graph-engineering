services:
  mongodb:
    image: mongo:8.0.12
    container_name: graph-engineering-mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - graph-engineering-mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  graph-engineering-mongodb:

